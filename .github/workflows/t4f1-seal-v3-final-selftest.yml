name: T4F1 Seal V3 Final Verifier Self-Test

on:
  push:
    branches:
      - fix/t4f1-seal-v3-final-verifier-closure-2026-09-04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch bound approval branches
        run: |
          git fetch origin \
            hr/rereview-t4f1-prereg-2026-09-04 \
            cochair/exact-byte-approval-t4f1-prereg-2026-09-04 \
            hr/ratify-v7-governance-2026-09-03

      - name: Production Seal V3 final verifier
        run: python -B tools/verify_preregistration_seal_v3_final.py

      - name: Two-layer negative controls
        run: python -B tools/test_verify_preregistration_seal_v3_final.py

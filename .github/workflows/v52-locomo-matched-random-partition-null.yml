name: V52 LoCoMo matched random-partition null

on:
  push:
    branches:
      - research/v52-sign-mechanism-locomo-2026-09-04
    paths:
      - research/v52/TRIGGER_MATCHED_RANDOM_PARTITION_NULL_2026-09-04.txt

permissions:
  contents: write

jobs:
  null_control:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify pre-run seal and exact blobs
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('research/v52/V52_MATCHED_RANDOM_PARTITION_NULL_PRERUN_SEAL_2026-09-04.json')
          seal=json.loads(p.read_text())
          if seal.get('status') != 'PRERUN_SEALED_NO_OUTCOME_ACCESS':
              raise SystemExit('seal status mismatch')
          for key in ['preregistration','locomo_runner','locomo_workflow','longmemeval_runner','longmemeval_workflow']:
              ent=seal[key]
              got=subprocess.check_output(['git','hash-object',ent['path']], text=True).strip()
              if got != ent['git_blob_sha1']:
                  raise SystemExit(f'blob mismatch {key}: {got} != {ent["git_blob_sha1"]}')
          print('PRERUN_SEAL_BLOB_GATE PASS')
          PY
          python -m py_compile research/v52/locomo_matched_random_partition_null.py

      - name: Install frozen-compatible numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0'

      - name: Run preregistered LoCoMo matched null control
        run: |
          python research/v52/locomo_matched_random_partition_null.py --out /tmp/locomo_random_partition_outputs
          rm -rf /tmp/locomo_random_partition_outputs/source_bytes
          python -m pip freeze > /tmp/locomo_random_partition_outputs/environment.txt

      - name: Upload immutable result artifact
        uses: actions/upload-artifact@v4
        with:
          name: v52-locomo-matched-random-partition-null-results
          path: /tmp/locomo_random_partition_outputs
          if-no-files-found: error
          retention-days: 30

      - name: Persist outputs on research branch
        shell: bash
        run: |
          git config user.name 'V52 Research Runner'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          mkdir -p research/v52/locomo_random_partition_outputs
          cp -a /tmp/locomo_random_partition_outputs/. research/v52/locomo_random_partition_outputs/
          git add research/v52/locomo_random_partition_outputs
          if ! git diff --cached --quiet; then
            git commit -m 'research(v52): persist preregistered LoCoMo random-partition null result'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

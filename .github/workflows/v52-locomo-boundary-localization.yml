name: V52 LoCoMo Head/Tail boundary localization

on:
  push:
    branches:
      - research/v52-sign-mechanism-locomo-2026-09-04
    paths:
      - research/v52/TRIGGER_BOUNDARY_LOCALIZATION_2026-09-04.txt

permissions:
  contents: write

jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify trigger, pre-run seal, and exact blobs
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          trigger=Path('research/v52/TRIGGER_BOUNDARY_LOCALIZATION_2026-09-04.txt').read_text().strip()
          if not trigger.startswith('seal_git_blob='):
              raise SystemExit('invalid trigger')
          expected=trigger.split('=',1)[1]
          seal_path=Path('research/v52/V52_BOUNDARY_LOCALIZATION_PRERUN_SEAL_2026-09-04.json')
          got=subprocess.check_output(['git','hash-object',str(seal_path)], text=True).strip()
          if got != expected:
              raise SystemExit(f'seal blob mismatch {got} != {expected}')
          seal=json.loads(seal_path.read_text())
          if seal.get('status') != 'PRERUN_SEALED_NO_OUTCOME_ACCESS':
              raise SystemExit('seal status mismatch')
          for key in ['preregistration','post_audit_addendum','locomo_runner','longmemeval_runner','locomo_workflow','longmemeval_workflow','locomo_base','longmemeval_base']:
              ent=seal[key]
              actual=subprocess.check_output(['git','hash-object',ent['path']], text=True).strip()
              if actual != ent['git_blob_sha1']:
                  raise SystemExit(f'blob mismatch {key}: {actual} != {ent["git_blob_sha1"]}')
          print('BOUNDARY_LOCALIZATION_PRERUN_GATE PASS')
          PY
          python -m py_compile research/v52/locomo_boundary_localization.py
      - name: Install frozen-compatible numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - name: Run preregistered LoCoMo boundary localization
        run: |
          python research/v52/locomo_boundary_localization.py --out /tmp/locomo_boundary_outputs
          rm -rf /tmp/locomo_boundary_outputs/source_bytes
          python -m pip freeze > /tmp/locomo_boundary_outputs/environment.txt
      - name: Upload immutable result artifact
        uses: actions/upload-artifact@v4
        with:
          name: v52-locomo-boundary-localization-results
          path: /tmp/locomo_boundary_outputs
          if-no-files-found: error
          retention-days: 30
      - name: Persist outputs on research branch
        shell: bash
        run: |
          git config user.name 'V52 Research Runner'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          mkdir -p research/v52/locomo_boundary_outputs
          cp -a /tmp/locomo_boundary_outputs/. research/v52/locomo_boundary_outputs/
          git add research/v52/locomo_boundary_outputs
          if ! git diff --cached --quiet; then
            git commit -m 'research(v52): persist preregistered LoCoMo boundary localization result'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

name: SIGN96 NanoBEIR 13-task sweep

on:
  push:
    branches:
      - bench/sign96-nanobeir-sweep-2026-09-14
    paths:
      - "benchmarks/sign96_nanobeir_2026_09_14/**"
      - ".github/workflows/sign96-nanobeir-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task:
          - NanoArguAna
          - NanoClimateFEVER
          - NanoDBPedia
          - NanoFEVER
          - NanoFiQA2018
          - NanoHotpotQA
          - NanoMSMARCO
          - NanoNFCorpus
          - NanoNQ
          - NanoQuoraRetrieval
          - NanoSCIDOCS
          - NanoSciFact
          - NanoTouche2020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install frozen math stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==2.3.5" \
            "pandas==2.2.3" \
            "scipy==1.17.0" \
            "scikit-learn==1.8.0" \
            "datasets>=4,<5" \
            "huggingface_hub>=0.34,<2"
          python -m pip freeze > benchmarks/sign96_nanobeir_2026_09_14/ENV_FREEZE.txt
      - name: Run outcome-blind task
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          mkdir -p benchmarks/sign96_nanobeir_2026_09_14/out
          python benchmarks/sign96_nanobeir_2026_09_14/run_nanobeir.py \
            --task "${{ matrix.task }}" \
            --outdir benchmarks/sign96_nanobeir_2026_09_14/out
      - uses: actions/upload-artifact@v4
        with:
          name: sign96-${{ matrix.task }}
          if-no-files-found: error
          retention-days: 30
          path: |
            benchmarks/sign96_nanobeir_2026_09_14/out/${{ matrix.task }}.json
            benchmarks/sign96_nanobeir_2026_09_14/out/${{ matrix.task }}.queries.jsonl
            benchmarks/sign96_nanobeir_2026_09_14/ENV_FREEZE.txt

  summarize:
    name: summarize
    needs: benchmark
    if: ${{ always() && needs.benchmark.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "numpy==2.3.5"
      - uses: actions/download-artifact@v4
        with:
          pattern: sign96-*
          path: downloaded
          merge-multiple: true
      - name: Build summary
        run: |
          python benchmarks/sign96_nanobeir_2026_09_14/summarize.py \
            --input downloaded \
            --out-md downloaded/NANOBEIR_SUMMARY.md \
            --out-json downloaded/NANOBEIR_SUMMARY.json
      - uses: actions/upload-artifact@v4
        with:
          name: sign96-nanobeir-summary
          if-no-files-found: error
          retention-days: 30
          path: |
            downloaded/NANOBEIR_SUMMARY.md
            downloaded/NANOBEIR_SUMMARY.json

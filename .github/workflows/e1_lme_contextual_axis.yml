name: E1 LME contextual axis
on:
  push:
    branches:
      - research/e1-lme-secondary-run-2026-09-13
    paths:
      - 'campaign_2026_09_13/e1_mechanism/e1_lme_contextual_axis.py'
      - '.github/workflows/e1_lme_contextual_axis.yml'
  workflow_dispatch:
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Run contextual axis probe
        run: python campaign_2026_09_13/e1_mechanism/e1_lme_contextual_axis.py

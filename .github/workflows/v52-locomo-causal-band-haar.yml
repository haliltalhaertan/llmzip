# Outcome-neutral trigger commit after workflow registration.
name: V52 LoCoMo causal spectral-band Haar

on:
  push:
    branches:
      - research/v52-sign-mechanism-locomo-2026-09-04
    paths:
      - .github/workflows/v52-locomo-causal-band-haar.yml
      - research/v52/locomo_spectral_band_haar_causal.py

permissions:
  contents: write

jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify preregistration and frozen source blobs
        shell: bash
        run: |
          test "$(git hash-object research/v52/V52_CAUSAL_SPECTRAL_BAND_HAAR_PREREG_2026-09-04.md)" = "02aa91a12b4052bbb2f0a6617167c8851e4f71f7"
          test "$(git hash-object research/v52/locomo_sign_mechanism_replication.py)" = "6700454915176854a55b0b5cf6ffe922a22e35f2"
          python -m py_compile research/v52/locomo_spectral_band_haar_causal.py

      - name: Install frozen-compatible numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0'

      - name: Run preregistered LoCoMo causal intervention
        run: |
          python research/v52/locomo_spectral_band_haar_causal.py --out /tmp/locomo_causal_outputs
          rm -rf /tmp/locomo_causal_outputs/source_bytes
          python -m pip freeze > /tmp/locomo_causal_outputs/environment.txt

      - name: Persist causal outputs on research branch
        shell: bash
        run: |
          mkdir -p research/v52/locomo_causal_outputs
          cp -a /tmp/locomo_causal_outputs/. research/v52/locomo_causal_outputs/
          git config user.name 'V52 Research Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add research/v52/locomo_causal_outputs
          if ! git diff --cached --quiet; then
            git commit -m 'research(v52): record preregistered LoCoMo spectral-band causal result'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload causal result artifact
        uses: actions/upload-artifact@v4
        with:
          name: v52-locomo-causal-band-haar-results
          path: /tmp/locomo_causal_outputs
          if-no-files-found: error
          retention-days: 30

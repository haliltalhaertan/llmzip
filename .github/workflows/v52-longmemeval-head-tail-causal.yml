name: V52 LongMemEval head-tail two-subspace causal

on:
  push:
    branches:
      - research/v52-sign-mechanism-locomo-2026-09-04
    paths:
      - .github/workflows/v52-longmemeval-head-tail-causal.yml
      - research/v52/longmemeval_head_tail_shard.py

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify preregistration and frozen sources
        shell: bash
        run: |
          test "$(git hash-object research/v52/V52_CAUSAL_HEAD_TAIL_TWO_SUBSPACE_HAAR_PREREG_2026-09-04.md)" = "0d34207be55a75194b585789c7139cbc8aeb264d"
          test "$(git hash-object research/v52/longmemeval_spectral_band_haar_causal.py)" = "79dd4a5ec462102da5d82530088a4b7e89bef437"
          test "$(git hash-object research/v52/longmemeval_head_tail_shard.py)" = "184a8a4bbb7d991c875ee1dcb92aa85b5e718074"
          echo '0a1a39a8dc839ff969a3c90b747edd544bdae112bb59091e969ddecb00fab722  adapters/longmemeval_v52_adapter.py' | sha256sum -c -
          echo '643082d6fc6b82fdd68dc7d97a77258b1d68eb1e479b2e390f13137d3dc1a218  adapters/longmemeval_v52_adapter_v2.py' | sha256sum -c -
          python -m py_compile research/v52/longmemeval_head_tail_shard.py
      - name: Install frozen-compatible numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - name: Download and verify frozen LongMemEval dataset
        shell: bash
        run: |
          curl -L --fail --retry 5 --retry-delay 2 -o /tmp/longmemeval_s_cleaned.json 'https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json'
          test "$(stat -c%s /tmp/longmemeval_s_cleaned.json)" = "277383467"
          echo 'd6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442  /tmp/longmemeval_s_cleaned.json' | sha256sum -c -
      - name: Run exact deterministic head-tail shard
        run: |
          python research/v52/longmemeval_head_tail_shard.py \
            --dataset /tmp/longmemeval_s_cleaned.json \
            --shard-index ${{ matrix.shard }} \
            --num-shards 5 \
            --shard-out /tmp/shard_${{ matrix.shard }}.pkl
      - uses: actions/upload-artifact@v4
        with:
          name: v52-longmemeval-head-tail-shard-${{ matrix.shard }}
          path: /tmp/shard_${{ matrix.shard }}.pkl
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen-compatible numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: v52-longmemeval-head-tail-shard-*
          path: /tmp/shards
          merge-multiple: true
      - name: Aggregate preregistered result
        run: |
          python research/v52/longmemeval_head_tail_shard.py --aggregate-dir /tmp/shards --out /tmp/final
          python -m pip freeze > /tmp/final/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v52-longmemeval-head-tail-causal-final
          path: /tmp/final
          if-no-files-found: error
          retention-days: 30
      - name: Persist authoritative result package
        shell: bash
        run: |
          git config user.name 'V52 Research Runner'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          mkdir -p research/v52/longmemeval_head_tail_outputs
          cp -a /tmp/final/. research/v52/longmemeval_head_tail_outputs/
          git add research/v52/longmemeval_head_tail_outputs
          if ! git diff --cached --quiet; then
            git commit -m 'research(v52): persist preregistered LongMemEval head-tail causal package'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

name: V52 LongMemEval causal sharded recovery

on:
  push:
    branches:
      - research/v52-sign-mechanism-locomo-2026-09-04
    paths:
      - .github/workflows/v52-longmemeval-causal-sharded-recovery.yml
      - research/v52/longmemeval_causal_shard.py
      - research/v52/longmemeval_spectral_band_haar_causal.py
      - research/v52/V52_CAUSAL_SPECTRAL_BAND_HAAR_PREREG_2026-09-04.md

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify frozen preregistration and adapters
        shell: bash
        run: |
          test "$(git hash-object research/v52/V52_CAUSAL_SPECTRAL_BAND_HAAR_PREREG_2026-09-04.md)" = "02aa91a12b4052bbb2f0a6617167c8851e4f71f7"
          echo '0a1a39a8dc839ff969a3c90b747edd544bdae112bb59091e969ddecb00fab722  adapters/longmemeval_v52_adapter.py' | sha256sum -c -
          echo '643082d6fc6b82fdd68dc7d97a77258b1d68eb1e479b2e390f13137d3dc1a218  adapters/longmemeval_v52_adapter_v2.py' | sha256sum -c -
          python -m py_compile research/v52/longmemeval_spectral_band_haar_causal.py research/v52/longmemeval_causal_shard.py
      - name: Install frozen-compatible numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - name: Download and verify frozen LongMemEval dataset
        shell: bash
        run: |
          curl -L --fail --retry 5 --retry-delay 2 -o /tmp/longmemeval_s_cleaned.json 'https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json'
          test "$(stat -c%s /tmp/longmemeval_s_cleaned.json)" = "277383467"
          echo 'd6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442  /tmp/longmemeval_s_cleaned.json' | sha256sum -c -
      - name: Run exact deterministic shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          NUM_SHARDS: '5'
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json, os, pickle
          from pathlib import Path

          runner_path=Path('research/v52/longmemeval_spectral_band_haar_causal.py').resolve()
          spec=importlib.util.spec_from_file_location('lm_causal_runner_serial', runner_path)
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot import causal runner')
          r=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(r)

          dataset=Path('/tmp/longmemeval_s_cleaned.json')
          if dataset.stat().st_size != r.DATASET_BYTES:
              raise RuntimeError('dataset byte mismatch')
          if r.sha256_file(dataset) != r.DATASET_SHA256:
              raise RuntimeError('dataset sha mismatch')
          if r.sha256_file(r.A1_PATH) != r.A1_SHA256 or r.sha256_file(r.A2_PATH) != r.A2_SHA256:
              raise RuntimeError('adapter identity mismatch')

          data=json.loads(dataset.read_text(encoding='utf-8'))
          prim=[x for x in data if not str(x['question_id']).endswith('_abs')]
          if len(data) != 500 or len(prim) != r.EXPECTED_PRIMARY:
              raise RuntimeError('cohort mismatch')
          allq=sorted(str(x['question_id']) for x in data)
          lex={q:i for i,q in enumerate(allq)}
          shard=int(os.environ['SHARD_INDEX']); n=int(os.environ['NUM_SHARDS'])
          chosen=[x for i,x in enumerate(prim) if i % n == shard]
          tforms={s:r.transforms(s) for s in r.CAUSAL_SEEDS}
          for seed,dd in tforms.items():
              for method,R in dd.items():
                  err=float(abs(R.T@R - __import__('numpy').eye(96)).max())
                  if err > r.TOL:
                      raise RuntimeError(f'orthogonality failure {seed} {method} {err}')
          results=[r.evaluate_one((x,lex[str(x['question_id'])],tforms)) for x in chosen]
          qids=[z['qid'] for z in results]
          if len(qids) != len(set(qids)) or len(qids) != len(chosen):
              raise RuntimeError('shard qid integrity failure')
          payload={'shard_index':shard,'num_shards':n,'count':len(results),'qids':qids,'results':results}
          out=Path(f'/tmp/shard_{shard}.pkl')
          out.write_bytes(pickle.dumps(payload,protocol=pickle.HIGHEST_PROTOCOL))
          print(json.dumps({'shard':shard,'count':len(results),'max_norm':max(z['max_norm'] for z in results),'max_dot':max(z['max_dot'] for z in results)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v52-longmemeval-causal-shard-${{ matrix.shard }}
          path: /tmp/shard_${{ matrix.shard }}.pkl
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen-compatible numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: v52-longmemeval-causal-shard-*
          path: /tmp/shards
          merge-multiple: true
      - name: Aggregate and enforce exact-equivalence gates
        shell: bash
        run: |
          python research/v52/longmemeval_causal_shard.py --aggregate-dir /tmp/shards --out /tmp/final
          python - <<'PY'
          import json, math
          got=json.load(open('/tmp/final/longmemeval_causal_summary.json'))
          exp={
            'native_R3':0.5419751773049645,
            'frozen_full_haar_R3':0.38271666666667,
            'within_band_haar_mean_R3':0.5192287234042553,
            'L_full':0.1592585106382945,
            'L_band':0.022746453900709174,
            'rho':0.14282724238436822,
          }
          for k,v in exp.items():
            x=float(got['primary'][k])
            if not math.isclose(x,v,rel_tol=0.0,abs_tol=1e-12):
              raise SystemExit(f'exact-equivalence failure {k}: {x} vs {v}')
          if got['primary']['regime'] != '[SPECTRAL-SUBSPACE PRESERVATION LEAD]':
            raise SystemExit('regime mismatch')
          print('EXACT_EQUIVALENCE_GATE PASS')
          PY
          python -m pip freeze > /tmp/final/environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v52-longmemeval-causal-sharded-final
          path: /tmp/final
          if-no-files-found: error
          retention-days: 30
      - name: Persist authoritative sharded outputs
        shell: bash
        run: |
          git config user.name 'V52 Research Runner'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          mkdir -p research/v52/longmemeval_causal_outputs
          cp -a /tmp/final/. research/v52/longmemeval_causal_outputs/
          git add research/v52/longmemeval_causal_outputs
          if ! git diff --cached --quiet; then
            git commit -m 'research(v52): persist exact sharded LongMemEval causal package'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
